spring.application.name=TractorNow

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tractor_now?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.time-zone=Asia/Kolkata

jwt.secret=tractorNowSuperSecretKeyChangeThisInProduction123456789
jwt.expiration=86400000

logging.level.org.springframework.security=INFO
